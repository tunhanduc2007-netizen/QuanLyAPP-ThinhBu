<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10B981">
  <title>FinTrack Pro — Quản Lý Tài Chính & Sổ Cái SSOT</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  <!-- iOS & Android PWA Add to Home Screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinTrack Pro">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png">
  
  <!-- Standard Favicon & Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="shortcut icon" href="/apple-touch-icon.png">

  <!-- Google Fonts: Luxury Neo-Grotesque Typography for Vietnamese FinTech -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Micro Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <!-- Compiled CSS Bundle -->
  <link rel="stylesheet" href="/assets/app.css?v=19">
  
  <!-- Immediate Theme Initializer -->
  <script>
    try {
      var savedTheme = localStorage.getItem('fintrack_theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
</head>
<body>

  <!-- REACT ROOT CONTAINER -->
  <div id="root"></div>

  <!-- App Core Platform Engines -->
  <script src="/src/constants/data.js"></script>
  <script src="/src/services/ocr/ocr-engine.js"></script>
  <script src="/src/services/firebase/firebase-sync.js"></script>

  <!-- AI Agent Scripts -->
  <script src="/src/services/ai/ai-schema.js"></script>
  <script src="/src/services/ai/ai-validator.js"></script>
  <script src="/src/services/ai/ai-provider.js"></script>
  <script src="/src/services/ai/expense-parser.js"></script>
  <script src="/src/services/ai/financial-insights.js"></script>
  <script src="/src/services/ai/receipt-parser.js"></script>
  <script src="/src/services/ai/ai-agent.js"></script>

  <!-- React Production Compiled Bundle -->
  <script type="module" crossorigin src="/assets/app.js?v=14"></script>
</body>
</html>
